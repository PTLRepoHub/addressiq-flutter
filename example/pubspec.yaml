name: addressiq_example
description: Example app consuming the local addressiq_sdk.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Linked to the local SDK at the repo root.
  addressiq_sdk:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs a test ON a device rather than in the Dart VM. The signal collector
  # asks the platform whether it is physical hardware, which a host-side test
  # cannot answer — and "cannot answer" reported as a clean device is exactly
  # how two Android signals stayed silently broken.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
